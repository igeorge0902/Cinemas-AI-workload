schema_version: 2
speckit_lifecycle:
  entrypoint: speckit.specify
  flow:
    - speckit.specify
    - speckit.clarify
    - speckit.plan
    - speckit.tasks
    - speckit.analyze
    - speckit.implement
    - speckit.checklist
  optional:
    - speckit.constitution
    - speckit.taskstoissues
  lifecycle_paths:
    constitution: .ai/constitution/constitution.md
    features_root: .ai/specs/legacy-specify/features
    templates_root: .ai/specs/templates
    scripts_root: .ai/specs/legacy-specify/scripts/bash
    prompts_root: .ai/prompts
agents:
  - name: speckit.specify
    scope:
      - specification
      - requirements
      - feature-init
    vocabulary:
      - scope
      - user-story
      - acceptance-criteria
      - branch
      - feature
      - cid
    direct_tasks:
      - task: create or refine feature specification
        trigger: intent_match
        priority: high
      - task: initialize feature artifacts and naming
        trigger: intent_match
        priority: high

  - name: speckit.clarify
    scope:
      - clarification
      - ambiguity-resolution
      - requirements-quality
    vocabulary:
      - ambiguity
      - assumption
      - edge-case
      - question
      - constraint
      - acceptance
    direct_tasks:
      - task: identify and resolve specification ambiguities
        trigger: intent_match
        priority: high
      - task: capture explicit assumptions before planning
        trigger: intent_match
        priority: high

  - name: speckit.plan
    scope:
      - architecture-planning
      - implementation-strategy
      - sequencing
    vocabulary:
      - milestone
      - dependency
      - risk
      - architecture
      - rollout
      - contract
    direct_tasks:
      - task: generate implementation plan from approved specification
        trigger: intent_match
        priority: high
      - task: align plan with constitution constraints
        trigger: intent_match
        priority: high

  - name: speckit.tasks
    scope:
      - task-breakdown
      - execution-slicing
      - delivery-tracking
    vocabulary:
      - phase
      - checklist
      - owner
      - estimate
      - dependency
      - validation
    direct_tasks:
      - task: create actionable task list from plan
        trigger: intent_match
        priority: high
      - task: enforce ordering and dependency correctness
        trigger: intent_match
        priority: high

  - name: speckit.analyze
    scope:
      - consistency-audit
      - risk-analysis
      - readiness-review
    vocabulary:
      - inconsistency
      - gap
      - risk
      - conflict
      - coverage
      - critical
    direct_tasks:
      - task: audit spec, plan, and tasks for alignment
        trigger: intent_match
        priority: high
      - task: report blocking issues before implementation
        trigger: intent_match
        priority: high

  - name: speckit.implement
    scope:
      - execution
      - coding
      - validation
    vocabulary:
      - patch
      - compile
      - test
      - regression
      - handoff
      - completion
    direct_tasks:
      - task: execute approved tasks in order
        trigger: intent_match
        priority: high
      - task: validate edits with build and test checks
        trigger: intent_match
        priority: high

  - name: speckit.checklist
    scope:
      - qa-gate
      - release-readiness
      - acceptance-verification
    vocabulary:
      - checklist
      - done-criteria
      - sign-off
      - gate
      - regression
      - handoff
    direct_tasks:
      - task: generate and enforce completion checklist
        trigger: intent_match
        priority: high
      - task: verify definition of done coverage
        trigger: intent_match
        priority: high

  - name: speckit.constitution
    scope:
      - governance
      - constitutional-rules
      - policy-updates
    vocabulary:
      - principle
      - governance
      - version
      - ratification
      - amendment
      - policy
    direct_tasks:
      - task: update constitution and propagate template impacts
        trigger: intent_match
        priority: high
      - task: enforce constitutional consistency across lifecycle artifacts
        trigger: intent_match
        priority: high

  - name: speckit.taskstoissues
    scope:
      - issue-tracking
      - backlog-sync
      - execution-ops
    vocabulary:
      - issue
      - backlog
      - sync
      - tracker
      - status
      - linkage
    direct_tasks:
      - task: convert tasks into issue tracker items
        trigger: intent_match
        priority: medium
      - task: keep issue status aligned with task completion
        trigger: intent_match
        priority: medium

  - name: backend-dev
    scope:
      - quarkus
      - java
      - rest-api
    vocabulary:
      - endpoint
      - dto
      - service
      - repository
      - transaction
      - pagination
    direct_tasks:
      - task: add or update rest endpoints
        trigger: intent_match
        priority: medium
      - task: implement service-layer business rules
        trigger: intent_match
        priority: medium
      - task: fix api validation and error mapping
        trigger: incident
        priority: high
      - task: wire downstream client calls and headers
        trigger: intent_match
        priority: medium
      - task: add backend unit/integration tests
        trigger: intent_match
        priority: medium

  - name: devops
    scope:
      - kubernetes
      - ci-cd
      - observability
    vocabulary:
      - deployment
      - ingress
      - rollout
      - pipeline
      - helm
      - autoscaling
    direct_tasks:
      - task: update k8s manifests and service exposure
        trigger: intent_match
        priority: medium
      - task: improve ci-cd build and release pipelines
        trigger: intent_match
        priority: medium
      - task: troubleshoot pod crashes and rollout issues
        trigger: incident
        priority: high
      - task: configure metrics, logs, and tracing
        trigger: intent_match
        priority: medium
      - task: harden runtime config and secret handling
        trigger: incident
        priority: high

  - name: ios-dev
    scope:
      - swift
      - ios
      - ui
      - architecture-planning
      - implementation
      - code-review
    vocabulary:
      - swiftui
      - uikit
      - urlsession
      - async-await
      - navigation
      - keychain
      - viewmodel
      - acceptance-criteria
      - diff-review
      - regression-risk
      - swift-concurrency
    workflow:
      planning:
        purpose: inspect and plan before editing
        responsibilities:
          - inspect the actual repository, current working-tree changes, and established app patterns
          - map affected screens, services, data managers, navigation, state, and API contracts
          - define exact files and symbols, behavior to preserve, edge cases, acceptance criteria, and validation commands
          - identify ambiguities and risks; ask only when a decision materially affects implementation
        output:
          - repository evidence and current behavior
          - scoped implementation plan and file list
          - acceptance criteria and verification plan
        suggested_models:
          primary: gpt-5.6-luna
          alternative: claude-sonnet-5
      code_writing:
        purpose: implement the approved plan without expanding scope
        responsibilities:
          - follow existing SwiftCinemas architecture, AppServices injection, service wrappers, data managers, and navigation patterns
          - preserve API paths, query parameters, decoding, caching, authentication, error behavior, and user-visible flows unless explicitly changed
          - respect Swift 6 actor isolation and concurrency; keep UIKit work on MainActor
          - keep edits bounded and report files changed and checks actually run
        dispatch:
          quick_engineer:
            agent: Cinemas Quick Engineer
            eligibility: fully specified, pattern-following edits in at most two files with a known validation command
            exclusions: multi-file architectural changes, ambiguous design decisions, auth/session/cookies, security, and other fast-tier protected areas
          otherwise: Cinemas iOS Engineer
        suggested_models:
          bounded_edit: mai-code-1.1-flash
          multi_file_or_architectural_change: gpt-5.6-luna
          fallback: gpt-5.6-luna
      review:
        purpose: independently assess the implementation against the plan
        responsibilities:
          - review the complete diff against the pre-edit working-tree baseline, including pre-existing dirty changes
          - check acceptance criteria, API and navigation regressions, state ownership, Swift 6 concurrency, error paths, and scope creep
          - run or inspect relevant validation and distinguish parsing from typechecking, building, and tests
          - report findings by severity with file and symbol references; do not silently rewrite unrelated code
        suggested_models:
          primary: claude-sonnet-5
          cost_efficient_alternative: gpt-6-luna
        independence: review should be a separate stage from code writing; do not treat the implementer's self-review as independent approval
    direct_tasks:
      - task: plan iOS changes from repository evidence before editing
        trigger: intent_match
        priority: high
      - task: build or refactor iOS screens and view models from an approved plan
        trigger: intent_match
        priority: medium
      - task: implement API client calls and decoding while preserving existing contracts
        trigger: intent_match
        priority: medium
      - task: improve state handling and navigation flow
        trigger: intent_match
        priority: medium
      - task: independently review iOS implementation diffs and regression risks
        trigger: intent_match
        priority: high
      - task: fix mobile-specific auth/session issues
        trigger: incident
        priority: high
      - task: add XCTest unit/ui tests inside SwiftCinemas (Appium suites belong to testing-engineer)
        trigger: intent_match
        priority: medium

  - name: database-dev
    scope:
      - sql
      - mysql
      - schema
    vocabulary:
      - migration
      - index
      - join
      - trigger
      - stored-procedure
      - transaction
    direct_tasks:
      - task: design or update schema objects
        trigger: intent_match
        priority: medium
      - task: optimize slow queries and indexes
        trigger: incident
        priority: high
      - task: maintain triggers and stored procedures
        trigger: intent_match
        priority: medium
      - task: create data backfill or repair scripts
        trigger: incident
        priority: high
      - task: validate data integrity and constraints
        trigger: incident
        priority: high

  - name: frontend-dev
    scope:
      - react
      - angular
      - css
    vocabulary:
      - component
      - route
      - state
      - template
      - form-validation
      - accessibility
    direct_tasks:
      - task: implement ui components and pages
        trigger: intent_match
        priority: medium
      - task: wire frontend routes and navigation
        trigger: intent_match
        priority: medium
      - task: add form validation and inline feedback
        trigger: intent_match
        priority: medium
      - task: integrate frontend with backend endpoints
        trigger: intent_match
        priority: medium
      - task: fix styling and responsive layout issues
        trigger: incident
        priority: low

  - name: testing-engineer
    scope:
      - unit-testing
      - integration-testing
      - e2e-testing
      - ios-ui-automation
    vocabulary:
      - appium
      - xcuitest
      - simulator
      - testng
      - test-case
      - assertion
      - mock
      - fixture
      - regression
      - coverage
    direct_tasks:
      - task: create and maintain test suites
        trigger: intent_match
        priority: medium
      - task: add mocks, fixtures, and test data
        trigger: intent_match
        priority: medium
      - task: reproduce bugs and add regression tests
        trigger: incident
        priority: high
      - task: improve flaky test stability
        trigger: incident
        priority: high
      - task: report coverage gaps and risk areas
        trigger: intent_match
        priority: medium
      - task: create, run, and maintain Appium XCUITest iOS UI suites, simulator config, and CI smoke runs in appium/
        trigger: intent_match
        priority: medium

  - name: security-specialist
    scope:
      - application-security
      - network-security
      - data-security
    vocabulary:
      - threat-model
      - cve
      - encryption
      - hmac
      - secrets
      - least-privilege
    direct_tasks:
      - task: review auth and authorization flows
        trigger: incident
        priority: high
      - task: scan dependencies and remediate cves
        trigger: incident
        priority: high
      - task: harden headers, cookies, and transport settings
        trigger: incident
        priority: high
      - task: validate secret storage and rotation strategy
        trigger: intent_match
        priority: high
      - task: test for common vulnerability classes
        trigger: intent_match
        priority: high

  - name: performance-engineer
    scope:
      - performance-testing
      - load-testing
      - stress-testing
    vocabulary:
      - latency
      - throughput
      - bottleneck
      - profiling
      - caching
      - concurrency
    direct_tasks:
      - task: benchmark critical request paths
        trigger: intent_match
        priority: medium
      - task: profile cpu, memory, and io hot spots
        trigger: incident
        priority: high
      - task: tune query/service/cache performance
        trigger: incident
        priority: high
      - task: design load and stress test scenarios
        trigger: intent_match
        priority: medium
      - task: define and track performance budgets
        trigger: intent_match
        priority: medium

  - name: ai-researcher
    scope:
      - machine-learning
      - deep-learning
      - natural-language-processing
    vocabulary:
      - dataset
      - embedding
      - fine-tuning
      - inference
      - evaluation
      - prompt
    direct_tasks:
      - task: define experiments and success metrics
        trigger: intent_match
        priority: medium
      - task: compare model or prompt variants
        trigger: intent_match
        priority: medium
      - task: prepare datasets and evaluation sets
        trigger: intent_match
        priority: medium
      - task: analyze model output quality and drift
        trigger: incident
        priority: high
      - task: document findings and recommendations
        trigger: intent_match
        priority: low


  - name: business-analyst
    scope:
      - requirements-gathering
      - requirements-analysis
      - current-state-analysis
      - process-modeling
      - stakeholder-alignment
      - product-documentation
      - architecture-documentation
      - documentation-maintenance
      - refactoring-analysis
      - change-impact-analysis
      - acceptance-criteria
      - traceability
    vocabulary:
      - user-story
      - acceptance-criteria
      - workflow
      - business-rule
      - current-state
      - target-state
      - as-is
      - to-be
      - traceability
      - source-of-truth
      - documentation-drift
      - dependency
      - change-impact
      - refactoring
      - regression-risk
      - migration
      - kpi
      - decision-log

    workflow:
      repository_analysis:
        purpose: establish an evidence-based understanding before recommending changes
        responsibilities:
          - inspect relevant repository files, existing documentation, configuration, tests, and working-tree changes
          - identify current behavior, system boundaries, business rules, dependencies, and documented assumptions
          - distinguish verified facts from inferences, unknowns, and conflicting sources
          - trace requirements and documentation claims to concrete files, symbols, endpoints, tests, or configuration
          - identify documentation drift, missing requirements, duplicated explanations, and obsolete instructions
          - avoid presenting inferred behavior as implemented behavior
        output:
          - current-state summary with repository evidence
          - confirmed requirements, assumptions, and open questions
          - gaps, inconsistencies, dependencies, and risks
          - impacted documentation and implementation areas
        suggested_models:
          primary: gpt-5.6-luna
          cost_efficient_alternative: gpt-6-luna
          deep_or_ambiguous_analysis: claude-sonnet-5

      requirements_and_process_design:
        purpose: translate business intent into clear, testable, traceable requirements
        responsibilities:
          - define scope, actors, goals, preconditions, main flows, alternate flows, and failure cases
          - write user stories, business rules, and measurable acceptance criteria
          - identify permissions, validation, error handling, data lifecycle, and integration constraints
          - make assumptions explicit and ask questions only when an unresolved decision materially affects scope or correctness
          - maintain traceability between stakeholder intent, requirements, acceptance criteria, and tests
          - align feature artifacts with the existing Spec Kit lifecycle and project constitution
        output:
          - scoped requirements and out-of-scope items
          - user stories and testable acceptance criteria
          - process flows and edge cases
          - assumptions, dependencies, risks, and unresolved decisions
          - requirements-to-tests traceability
        suggested_models:
          primary: gpt-5.6-luna
          alternative: claude-sonnet-5

      documentation_authoring:
        purpose: create clear, accurate, maintainable documentation from verified evidence
        responsibilities:
          - write and update README files, architecture guides, API descriptions, sequence diagrams, workflows, and operational documentation
          - follow the existing document structure, terminology, style, and diagram conventions
          - derive technical descriptions from current source code and configuration rather than assumptions
          - distinguish implemented behavior from proposed behavior and planned work
          - include concrete file paths, symbols, contracts, examples, and validation steps where useful
          - keep diagrams consistent with the written explanation and actual system boundaries
          - avoid unnecessary rewrites and preserve accurate existing content
          - validate links, headings, code blocks, diagrams, and generated HTML or Markdown structure where applicable
        output:
          - complete updated documentation or a focused patch
          - summary of changed sections and the evidence supporting them
          - documentation validation results and any unresolved discrepancies
        suggested_models:
          substantive_authoring: gpt-5.6-luna
          bounded_document_edit: gpt-6-luna
          independent_quality_review: claude-sonnet-5

      refactoring_preparation:
        purpose: prepare a safe, evidence-based refactoring proposal before implementation
        responsibilities:
          - document the existing architecture, responsibilities, data flows, contracts, and state ownership
          - identify duplication, coupling, unclear boundaries, documentation drift, and candidate refactoring seams
          - separate behavior-preserving refactoring from functional changes and new requirements
          - identify consumers, integrations, tests, compatibility constraints, and regression risks
          - propose incremental stages with explicit scope, dependencies, rollback considerations, and validation gates
          - define observable acceptance criteria and characterization or regression tests for existing behavior
          - map proposed changes to likely files, modules, components, and responsible engineering specialists
          - check proposals against existing project conventions and constitution constraints
          - avoid prescribing a technical design when repository evidence is insufficient; identify the decision needed
        output:
          - as-is and proposed to-be architecture
          - refactoring objectives and non-goals
          - impact map covering files, components, contracts, and consumers
          - ordered implementation stages and dependencies
          - acceptance criteria, regression risks, and verification plan
          - open technical decisions for the owning engineering specialist
        suggested_models:
          primary: gpt-5.6-luna
          complex_architecture_alternative: claude-sonnet-5
        handoff:
          - backend changes to Cinemas Backend Engineer
          - iOS changes to Cinemas iOS Engineer
          - database schema, query, or integrity changes to Cinemas Database Engineer
          - frontend changes to Cinemas Web Engineer
          - Kubernetes, deployment, or observability changes to Cinemas DevOps Engineer
          - test-suite implementation to Cinemas Testing Engineer
        boundaries:
          - prepare and document the refactoring plan; do not silently expand into implementation
          - obtain technical review from the owning specialist before treating an architecture proposal as approved
          - preserve existing behavior unless an explicit requirement authorizes a behavior change

      independent_review:
        purpose: check analytical quality and documentation correctness before handoff
        responsibilities:
          - verify claims against available repository evidence and linked sources
          - check consistency across requirements, plans, tasks, diagrams, and documentation
          - identify unsupported claims, missing edge cases, contradictory contracts, and scope creep
          - verify that acceptance criteria are observable and testable
          - check that proposed refactoring stages are incremental and have appropriate validation
          - report findings by severity and reference affected files or sections
          - distinguish confirmed defects from recommendations and unresolved questions
        output:
          - findings with severity, evidence, and affected artifacts
          - missing coverage and unresolved risks
          - explicit readiness recommendation and remaining blockers
        suggested_models:
          primary: claude-sonnet-5
          cost_efficient_alternative: gpt-6-luna
        independence: review should be a separate stage from authoring or planning; do not treat self-review as independent approval

    direct_tasks:
      - task: analyze existing requirements, source code, and documentation to establish verified current behavior
        trigger: intent_match
        priority: high
      - task: refine requirements into scoped user stories and business rules
        trigger: intent_match
        priority: high
      - task: write measurable acceptance criteria and edge cases
        trigger: intent_match
        priority: high
      - task: create or update architecture, API, workflow, and operational documentation from repository evidence
        trigger: intent_match
        priority: high
      - task: identify outdated, inconsistent, missing, or duplicated documentation
        trigger: intent_match
        priority: high
      - task: prepare an evidence-based refactoring proposal before code changes
        trigger: intent_match
        priority: high
      - task: analyze change impact, dependencies, compatibility, and regression risks
        trigger: intent_match
        priority: high
      - task: create traceability between requirements, implementation areas, acceptance criteria, and tests
        trigger: intent_match
        priority: medium
      - task: review specifications, plans, tasks, diagrams, and documentation for consistency
        trigger: intent_match
        priority: high
      - task: prioritize backlog items by business value, risk, and dependency
        trigger: intent_match
        priority: medium
      - task: align scope and unresolved decisions across stakeholders and engineering specialists
        trigger: intent_match
        priority: medium

  - name: cpp-developer
    # Canonical handle; legacy @c++ developer mention is deprecated.
    scope:
      - c++
      - systems-programming
      - performance-critical-code
    vocabulary:
      - raii
      - stl
      - smart-pointer
      - template
      - undefined-behavior
      - move-semantics
    direct_tasks:
      - task: implement core c++ features and modules
        trigger: intent_match
        priority: medium
      - task: fix ownership and memory safety bugs
        trigger: incident
        priority: high
      - task: optimize cpu and memory performance
        trigger: incident
        priority: high
      - task: improve template and build diagnostics
        trigger: intent_match
        priority: medium
      - task: add unit tests for low-level behavior
        trigger: intent_match
        priority: medium

  - name: fast-lane
    # Low-cost tier; see modelTiers for the narrow schema-documentation exception.
    scope:
      - lookup
      - mechanical-edit
      - summarization
    vocabulary:
      - locate
      - rename
      - bump
      - summarize
      - typo
      - config-value
    direct_tasks:
      - task: locate code, config, or docs and report evidence
        trigger: intent_match
        priority: low
      - task: apply a fully specified edit in at most two files
        trigger: intent_match
        priority: low
      - task: synchronize approved schema decisions in up to three explicitly named documentation files without design or SQL changes
        trigger: intent_match
        priority: low
        
businessAnalystModelPolicy:
  repository_analysis: gpt-5.6-luna
  requirements_and_process_design: gpt-5.6-luna
  documentation_authoring: gpt-5.6-luna
  refactoring_preparation: gpt-5.6-luna
  independent_review: claude-sonnet-5
  cost_efficient_alternative: gpt-6-luna
  review_policy:
    substantial_changes: required
    bounded_edits: optional
    author_and_reviewer_must_be_separate_stages: true

umbrellaRouting:
  # Enacted only when the user selects the umbrella agent. A directly selected
  # specialist keeps the task, and explicit /speckit.* commands keep their lifecycle.
  umbrellaAgent: Cinemas Router
  defaultAgent: none
  selectionPolicy:
    - Route to the smallest set of specialists that fully owns the requested outcome.
    - Explicit /speckit.* commands bypass umbrella routing and follow speckit_lifecycle.
    - For incidents, diagnose with the owning domain specialist before requesting edits from another domain.
    - Database contract or schema work precedes dependent backend and client changes.
    - Backend API contract work precedes dependent web or iOS integration changes.
    - Deployment and observability changes follow service validation unless the deployment itself is the incident.
    - Testing Engineer verifies changed behavior after implementation; it does not replace the owning implementation specialist.
    - Black-box iOS UI automation in appium/ (Appium, XCUITest driver, TestNG, simulator and CI smoke config) routes to Cinemas Testing Engineer; Cinemas iOS Engineer owns app-side changes such as accessibility identifiers and XCTest suites inside SwiftCinemas.
    - Security review is read-only first; route remediation to the owning implementation specialist after findings are established.
    - Independent specialists may run in parallel; dependent stages run in order.
    - Assign each stage a tier from modelTiers; use fast only within its criteria and protected-area rules, including the narrow schema-documentation exception.
    - Route schema design, migrations, and database repairs to Cinemas Database Engineer; route fully specified documentation edits directly to Cinemas Quick Engineer when the documentation exception applies, without a Database Engineer intermediary or nested delegation.
    - For eligible code writing, use specialist design then router dispatch to Cinemas Quick Engineer then owning specialist review; specialists return bounded handoffs rather than nesting agents.
    - A code handoff must name exact files, symbols, existing patterns, behaviour, error cases, acceptance criteria and validation; fast-tier protected-area exclusions still apply and missing design decisions remain with the specialist.
    - A fast-tier ESCALATE reply reroutes to the owning specialist as a new stage, reusing the evidence gathered.
    - If no route is trustworthy, use AGENTS.md and then ask the user rather than guessing.
        - Route repository analysis, requirements analysis, substantial documentation authoring, and refactoring preparation to Cinemas Business Analyst using the standard tier.
    - For bounded documentation edits with exact requirements, named files, and known validation, allow direct routing to Cinemas Quick Engineer when fast-tier criteria are satisfied.
    - For substantial documentation changes, require a separate review stage using the Business Analyst review model policy; keep review independent from authoring.
    - For refactoring preparation, have the Business Analyst establish current behavior, scope, impact, and acceptance criteria before the owning engineering specialist approves the technical approach.
    - Route implementation to the owning engineering specialist; do not let the Business Analyst's proposed architecture substitute for technical approval.
    - Validate generated documentation using checks appropriate to its format, including HTML parsing, Markdown links, diagram rendering, and consistency with source code where applicable.
  specialists:
    - name: Cinemas Backend Engineer
      roles: [backend-dev]
      triggers: [backend-api, backend-auth, downstream-client, backend-test]
    - name: Cinemas DevOps Engineer
      roles: [devops]
      triggers: [kubernetes, ci-cd, runtime-observability, deployment]
    - name: Cinemas iOS Engineer
      roles: [ios-dev]
      triggers: [ios-ui, ios-networking, ios-session, ios-test]
    - name: Cinemas Database Engineer
      roles: [database-dev]
      triggers: [database-schema, database-query, database-integrity, database-repair]
    - name: Cinemas Web Engineer
      roles: [frontend-dev]
      triggers: [web-ui, web-routing, web-integration, web-accessibility]
    - name: Cinemas Testing Engineer
      roles: [testing-engineer]
      triggers: [test-automation, appium-ios, regression-test, flaky-test, coverage-analysis]
    - name: Cinemas Security Reviewer
      roles: [security-specialist]
      triggers: [security-review, auth-security, dependency-security, secret-handling]
    - name: Cinemas Performance Engineer
      roles: [performance-engineer]
      triggers: [performance-test, profiling, performance-tuning, performance-budget]
    - name: Cinemas AI Researcher
      roles: [ai-researcher]
      triggers: [ai-experiment, ai-evaluation, ai-dataset, ai-drift]
    - name: Cinemas Business Analyst
      roles: [business-analyst]
      triggers:
        - requirements
        - acceptance-criteria
        - process-analysis
        - backlog-priority
        - repository-analysis
        - documentation-authoring
        - documentation-maintenance
        - refactoring-preparation
        - change-impact-analysis
        - documentation-review
    - name: Cinemas C++ Engineer
      roles: [cpp-developer]
      triggers: [cpp-feature, cpp-memory-safety, cpp-performance, cpp-test]
    - name: Cinemas Quick Engineer
      roles: [fast-lane]
      tier: fast
      triggers: [quick-edit]
    - name: Cinemas Scout
      roles: [fast-lane]
      tier: fast
      triggers: [lookup]
  routerHandles: [route-classification, final-handoff]
  telemetry:
    enabled: false
    protocol: .ai/agents/ROUTING-TELEMETRY.md
    output: .ai/generated/routing-telemetry/
    lifecycle: [route-start, stage-start, stage-end, route-end]
    attribution:
      exact: child session or delegation ID linked by runtime telemetry
      estimated: non-overlapping stage time window
      unavailable: no trustworthy runtime join
    privacy: summaries and identifiers only; never prompts, secrets, response bodies, or source content

modelTiers:
  # Models are pinned in agent frontmatter (`model:`); this section is the routing policy.
  # Measured local cost, Sep-Oct 2026 (AI credits per 1M input tokens): gpt-6-luna ~2.2,
  # mai-code-1.1-flash ~4.6, gpt-5.6-luna ~4.6, claude-sonnet-5 ~34, claude-opus-5 ~90.
  fast:
    agents:
      Cinemas Scout: gpt-6-luna
      Cinemas Quick Engineer: mai-code-1.1-flash
    fallbackModel: gpt-5.6-luna
    criteria:
      - Read-only lookup, evidence gathering, or log/report/doc summary; or
      - A fully specified edit in at most two files that follows an existing pattern and has a known validation command.
      - A documentation-only edit in up to three explicitly named linked documents recording an already approved schema decision, with exact wording or semantics supplied and a known validation command.
    protectedAreas: [auth, hmac, session, cookies, payments, seat-locking, transactions, database-schema, database-repair, kubernetes, cross-client-contract, security, incident]
    documentationException:
      area: database-schema
      agent: Cinemas Quick Engineer
      requirements:
        - Record an already approved decision only; no new schema design, investigation, SQL derivation, or contract decisions.
        - Change documentation prose, approval labels, or diagram annotations only; do not create or alter SQL blocks, schema files, migrations, repair scripts, application code, or database state.
        - Name all target files and the validation command in the handoff; maximum three linked documentation files.
        - All other protected-area exclusions remain in force, including incidents.
      dispatch: Directly from the router; no Database Engineer intermediary or nested delegation.
  standard:
    agents: all domain specialists
    model: runtime-default
    criteria:
      - Anything not fast, including diagnosis, design, multi-file or cross-module changes, protected areas, and incidents.
  escalation: A fast agent replies `ESCALATE` when out of scope; the router reroutes to the owning specialist and never retries the fast tier for the same work.

