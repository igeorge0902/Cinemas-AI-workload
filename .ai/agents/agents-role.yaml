schema_version: 2
speckit_lifecycle:
  entrypoint: speckit.specify
  flow:
    - speckit.specify
    - speckit.clarify
    - speckit.plan
    - speckit.tasks
    - speckit.analyze
    - speckit.implement
    - speckit.checklist
  optional:
    - speckit.constitution
    - speckit.taskstoissues
  lifecycle_paths:
    constitution: .ai/constitution/constitution.md
    features_root: .ai/specs/legacy-specify/features
    templates_root: .ai/specs/templates
    scripts_root: .ai/specs/legacy-specify/scripts/bash
    prompts_root: .ai/prompts
agents:
  - name: speckit.specify
    scope:
      - specification
      - requirements
      - feature-init
    vocabulary:
      - scope
      - user-story
      - acceptance-criteria
      - branch
      - feature
      - cid
    direct_tasks:
      - task: create or refine feature specification
        trigger: intent_match
        priority: high
      - task: initialize feature artifacts and naming
        trigger: intent_match
        priority: high

  - name: speckit.clarify
    scope:
      - clarification
      - ambiguity-resolution
      - requirements-quality
    vocabulary:
      - ambiguity
      - assumption
      - edge-case
      - question
      - constraint
      - acceptance
    direct_tasks:
      - task: identify and resolve specification ambiguities
        trigger: intent_match
        priority: high
      - task: capture explicit assumptions before planning
        trigger: intent_match
        priority: high

  - name: speckit.plan
    scope:
      - architecture-planning
      - implementation-strategy
      - sequencing
    vocabulary:
      - milestone
      - dependency
      - risk
      - architecture
      - rollout
      - contract
    direct_tasks:
      - task: generate implementation plan from approved specification
        trigger: intent_match
        priority: high
      - task: align plan with constitution constraints
        trigger: intent_match
        priority: high

  - name: speckit.tasks
    scope:
      - task-breakdown
      - execution-slicing
      - delivery-tracking
    vocabulary:
      - phase
      - checklist
      - owner
      - estimate
      - dependency
      - validation
    direct_tasks:
      - task: create actionable task list from plan
        trigger: intent_match
        priority: high
      - task: enforce ordering and dependency correctness
        trigger: intent_match
        priority: high

  - name: speckit.analyze
    scope:
      - consistency-audit
      - risk-analysis
      - readiness-review
    vocabulary:
      - inconsistency
      - gap
      - risk
      - conflict
      - coverage
      - critical
    direct_tasks:
      - task: audit spec, plan, and tasks for alignment
        trigger: intent_match
        priority: high
      - task: report blocking issues before implementation
        trigger: intent_match
        priority: high

  - name: speckit.implement
    scope:
      - execution
      - coding
      - validation
    vocabulary:
      - patch
      - compile
      - test
      - regression
      - handoff
      - completion
    direct_tasks:
      - task: execute approved tasks in order
        trigger: intent_match
        priority: high
      - task: validate edits with build and test checks
        trigger: intent_match
        priority: high

  - name: speckit.checklist
    scope:
      - qa-gate
      - release-readiness
      - acceptance-verification
    vocabulary:
      - checklist
      - done-criteria
      - sign-off
      - gate
      - regression
      - handoff
    direct_tasks:
      - task: generate and enforce completion checklist
        trigger: intent_match
        priority: high
      - task: verify definition of done coverage
        trigger: intent_match
        priority: high

  - name: speckit.constitution
    scope:
      - governance
      - constitutional-rules
      - policy-updates
    vocabulary:
      - principle
      - governance
      - version
      - ratification
      - amendment
      - policy
    direct_tasks:
      - task: update constitution and propagate template impacts
        trigger: intent_match
        priority: high
      - task: enforce constitutional consistency across lifecycle artifacts
        trigger: intent_match
        priority: high

  - name: speckit.taskstoissues
    scope:
      - issue-tracking
      - backlog-sync
      - execution-ops
    vocabulary:
      - issue
      - backlog
      - sync
      - tracker
      - status
      - linkage
    direct_tasks:
      - task: convert tasks into issue tracker items
        trigger: intent_match
        priority: medium
      - task: keep issue status aligned with task completion
        trigger: intent_match
        priority: medium

  - name: backend-dev
    scope:
      - quarkus
      - java
      - rest-api
    vocabulary:
      - endpoint
      - dto
      - service
      - repository
      - transaction
      - pagination
    direct_tasks:
      - task: add or update rest endpoints
        trigger: intent_match
        priority: medium
      - task: implement service-layer business rules
        trigger: intent_match
        priority: medium
      - task: fix api validation and error mapping
        trigger: incident
        priority: high
      - task: wire downstream client calls and headers
        trigger: intent_match
        priority: medium
      - task: add backend unit/integration tests
        trigger: intent_match
        priority: medium

  - name: devops
    scope:
      - kubernetes
      - ci-cd
      - observability
    vocabulary:
      - deployment
      - ingress
      - rollout
      - pipeline
      - helm
      - autoscaling
    direct_tasks:
      - task: update k8s manifests and service exposure
        trigger: intent_match
        priority: medium
      - task: improve ci-cd build and release pipelines
        trigger: intent_match
        priority: medium
      - task: troubleshoot pod crashes and rollout issues
        trigger: incident
        priority: high
      - task: configure metrics, logs, and tracing
        trigger: intent_match
        priority: medium
      - task: harden runtime config and secret handling
        trigger: incident
        priority: high

  - name: ios-dev
    scope:
      - swift
      - ios
      - ui
    vocabulary:
      - swiftui
      - uikit
      - urlsession
      - async-await
      - navigation
      - keychain
    direct_tasks:
      - task: build or refactor ios screens
        trigger: intent_match
        priority: medium
      - task: implement api client calls and decoding
        trigger: intent_match
        priority: medium
      - task: improve state handling and navigation flow
        trigger: intent_match
        priority: medium
      - task: fix mobile-specific auth/session issues
        trigger: incident
        priority: high
      - task: add ios unit/ui tests
        trigger: intent_match
        priority: medium

  - name: database-dev
    scope:
      - sql
      - mysql
      - schema
    vocabulary:
      - migration
      - index
      - join
      - trigger
      - stored-procedure
      - transaction
    direct_tasks:
      - task: design or update schema objects
        trigger: intent_match
        priority: medium
      - task: optimize slow queries and indexes
        trigger: incident
        priority: high
      - task: maintain triggers and stored procedures
        trigger: intent_match
        priority: medium
      - task: create data backfill or repair scripts
        trigger: incident
        priority: high
      - task: validate data integrity and constraints
        trigger: incident
        priority: high

  - name: frontend-dev
    scope:
      - react
      - angular
      - css
    vocabulary:
      - component
      - route
      - state
      - template
      - form-validation
      - accessibility
    direct_tasks:
      - task: implement ui components and pages
        trigger: intent_match
        priority: medium
      - task: wire frontend routes and navigation
        trigger: intent_match
        priority: medium
      - task: add form validation and inline feedback
        trigger: intent_match
        priority: medium
      - task: integrate frontend with backend endpoints
        trigger: intent_match
        priority: medium
      - task: fix styling and responsive layout issues
        trigger: incident
        priority: low

  - name: testing-engineer
    scope:
      - unit-testing
      - integration-testing
      - e2e-testing
    vocabulary:
      - test-case
      - assertion
      - mock
      - fixture
      - regression
      - coverage
    direct_tasks:
      - task: create and maintain test suites
        trigger: intent_match
        priority: medium
      - task: add mocks, fixtures, and test data
        trigger: intent_match
        priority: medium
      - task: reproduce bugs and add regression tests
        trigger: incident
        priority: high
      - task: improve flaky test stability
        trigger: incident
        priority: high
      - task: report coverage gaps and risk areas
        trigger: intent_match
        priority: medium

  - name: security-specialist
    scope:
      - application-security
      - network-security
      - data-security
    vocabulary:
      - threat-model
      - cve
      - encryption
      - hmac
      - secrets
      - least-privilege
    direct_tasks:
      - task: review auth and authorization flows
        trigger: incident
        priority: high
      - task: scan dependencies and remediate cves
        trigger: incident
        priority: high
      - task: harden headers, cookies, and transport settings
        trigger: incident
        priority: high
      - task: validate secret storage and rotation strategy
        trigger: intent_match
        priority: high
      - task: test for common vulnerability classes
        trigger: intent_match
        priority: high

  - name: performance-engineer
    scope:
      - performance-testing
      - load-testing
      - stress-testing
    vocabulary:
      - latency
      - throughput
      - bottleneck
      - profiling
      - caching
      - concurrency
    direct_tasks:
      - task: benchmark critical request paths
        trigger: intent_match
        priority: medium
      - task: profile cpu, memory, and io hot spots
        trigger: incident
        priority: high
      - task: tune query/service/cache performance
        trigger: incident
        priority: high
      - task: design load and stress test scenarios
        trigger: intent_match
        priority: medium
      - task: define and track performance budgets
        trigger: intent_match
        priority: medium

  - name: ai-researcher
    scope:
      - machine-learning
      - deep-learning
      - natural-language-processing
    vocabulary:
      - dataset
      - embedding
      - fine-tuning
      - inference
      - evaluation
      - prompt
    direct_tasks:
      - task: define experiments and success metrics
        trigger: intent_match
        priority: medium
      - task: compare model or prompt variants
        trigger: intent_match
        priority: medium
      - task: prepare datasets and evaluation sets
        trigger: intent_match
        priority: medium
      - task: analyze model output quality and drift
        trigger: incident
        priority: high
      - task: document findings and recommendations
        trigger: intent_match
        priority: low

  - name: business-analyst
    scope:
      - requirements-gathering
      - process-modeling
      - stakeholder-alignment
    vocabulary:
      - user-story
      - acceptance-criteria
      - workflow
      - kpi
      - dependency
      - risk
    direct_tasks:
      - task: refine requirements into clear stories
        trigger: intent_match
        priority: medium
      - task: write testable acceptance criteria
        trigger: intent_match
        priority: high
      - task: map process flows and edge cases
        trigger: intent_match
        priority: medium
      - task: prioritize backlog by value and risk
        trigger: intent_match
        priority: medium
      - task: align scope across stakeholders
        trigger: intent_match
        priority: medium

  - name: cpp-developer
    # Canonical handle; legacy @c++ developer mention is deprecated.
    scope:
      - c++
      - systems-programming
      - performance-critical-code
    vocabulary:
      - raii
      - stl
      - smart-pointer
      - template
      - undefined-behavior
      - move-semantics
    direct_tasks:
      - task: implement core c++ features and modules
        trigger: intent_match
        priority: medium
      - task: fix ownership and memory safety bugs
        trigger: incident
        priority: high
      - task: optimize cpu and memory performance
        trigger: incident
        priority: high
      - task: improve template and build diagnostics
        trigger: intent_match
        priority: medium
      - task: add unit tests for low-level behavior
        trigger: intent_match
        priority: medium

  - name: fast-lane
    # Low-cost tier; see modelTiers for the narrow schema-documentation exception.
    scope:
      - lookup
      - mechanical-edit
      - summarization
    vocabulary:
      - locate
      - rename
      - bump
      - summarize
      - typo
      - config-value
    direct_tasks:
      - task: locate code, config, or docs and report evidence
        trigger: intent_match
        priority: low
      - task: apply a fully specified edit in at most two files
        trigger: intent_match
        priority: low
      - task: synchronize approved schema decisions in up to three explicitly named documentation files without design or SQL changes
        trigger: intent_match
        priority: low

umbrellaRouting:
  # Enacted only when the user selects the umbrella agent. A directly selected
  # specialist keeps the task, and explicit /speckit.* commands keep their lifecycle.
  umbrellaAgent: Cinemas Router
  defaultAgent: none
  selectionPolicy:
    - Route to the smallest set of specialists that fully owns the requested outcome.
    - Explicit /speckit.* commands bypass umbrella routing and follow speckit_lifecycle.
    - For incidents, diagnose with the owning domain specialist before requesting edits from another domain.
    - Database contract or schema work precedes dependent backend and client changes.
    - Backend API contract work precedes dependent web or iOS integration changes.
    - Deployment and observability changes follow service validation unless the deployment itself is the incident.
    - Testing Engineer verifies changed behavior after implementation; it does not replace the owning implementation specialist.
    - Security review is read-only first; route remediation to the owning implementation specialist after findings are established.
    - Independent specialists may run in parallel; dependent stages run in order.
    - Assign each stage a tier from modelTiers; use fast only within its criteria and protected-area rules, including the narrow schema-documentation exception.
    - Route schema design, migrations, and database repairs to Cinemas Database Engineer; route fully specified documentation edits directly to Cinemas Quick Engineer when the documentation exception applies, without a Database Engineer intermediary or nested delegation.
    - For eligible code writing, use specialist design then router dispatch to Cinemas Quick Engineer then owning specialist review; specialists return bounded handoffs rather than nesting agents.
    - A code handoff must name exact files, symbols, existing patterns, behaviour, error cases, acceptance criteria and validation; fast-tier protected-area exclusions still apply and missing design decisions remain with the specialist.
    - A fast-tier ESCALATE reply reroutes to the owning specialist as a new stage, reusing the evidence gathered.
    - If no route is trustworthy, use AGENTS.md and then ask the user rather than guessing.
  specialists:
    - name: Cinemas Backend Engineer
      roles: [backend-dev]
      triggers: [backend-api, backend-auth, downstream-client, backend-test]
    - name: Cinemas DevOps Engineer
      roles: [devops]
      triggers: [kubernetes, ci-cd, runtime-observability, deployment]
    - name: Cinemas iOS Engineer
      roles: [ios-dev]
      triggers: [ios-ui, ios-networking, ios-session, ios-test]
    - name: Cinemas Database Engineer
      roles: [database-dev]
      triggers: [database-schema, database-query, database-integrity, database-repair]
    - name: Cinemas Web Engineer
      roles: [frontend-dev]
      triggers: [web-ui, web-routing, web-integration, web-accessibility]
    - name: Cinemas Testing Engineer
      roles: [testing-engineer]
      triggers: [test-automation, regression-test, flaky-test, coverage-analysis]
    - name: Cinemas Security Reviewer
      roles: [security-specialist]
      triggers: [security-review, auth-security, dependency-security, secret-handling]
    - name: Cinemas Performance Engineer
      roles: [performance-engineer]
      triggers: [performance-test, profiling, performance-tuning, performance-budget]
    - name: Cinemas AI Researcher
      roles: [ai-researcher]
      triggers: [ai-experiment, ai-evaluation, ai-dataset, ai-drift]
    - name: Cinemas Business Analyst
      roles: [business-analyst]
      triggers: [requirements, acceptance-criteria, process-analysis, backlog-priority]
    - name: Cinemas C++ Engineer
      roles: [cpp-developer]
      triggers: [cpp-feature, cpp-memory-safety, cpp-performance, cpp-test]
    - name: Cinemas Quick Engineer
      roles: [fast-lane]
      tier: fast
      triggers: [quick-edit]
    - name: Cinemas Scout
      roles: [fast-lane]
      tier: fast
      triggers: [lookup]
  routerHandles: [route-classification, final-handoff]
  telemetry:
    enabled: false
    protocol: .ai/agents/ROUTING-TELEMETRY.md
    output: .ai/generated/routing-telemetry/
    lifecycle: [route-start, stage-start, stage-end, route-end]
    attribution:
      exact: child session or delegation ID linked by runtime telemetry
      estimated: non-overlapping stage time window
      unavailable: no trustworthy runtime join
    privacy: summaries and identifiers only; never prompts, secrets, response bodies, or source content

modelTiers:
  # Models are pinned in agent frontmatter (`model:`); this section is the routing policy.
  # Measured local cost, Sep-Oct 2026 (AI credits per 1M input tokens): gpt-6-luna ~2.2,
  # mai-code-1.1-flash ~4.6, gpt-5.6-luna ~4.6, claude-sonnet-5 ~34, claude-opus-5 ~90.
  fast:
    agents:
      Cinemas Scout: gpt-6-luna
      Cinemas Quick Engineer: mai-code-1.1-flash
    fallbackModel: gpt-5.6-luna
    criteria:
      - Read-only lookup, evidence gathering, or log/report/doc summary; or
      - A fully specified edit in at most two files that follows an existing pattern and has a known validation command.
      - A documentation-only edit in up to three explicitly named linked documents recording an already approved schema decision, with exact wording or semantics supplied and a known validation command.
    protectedAreas: [auth, hmac, session, cookies, payments, seat-locking, transactions, database-schema, database-repair, kubernetes, cross-client-contract, security, incident]
    documentationException:
      area: database-schema
      agent: Cinemas Quick Engineer
      requirements:
        - Record an already approved decision only; no new schema design, investigation, SQL derivation, or contract decisions.
        - Change documentation prose, approval labels, or diagram annotations only; do not create or alter SQL blocks, schema files, migrations, repair scripts, application code, or database state.
        - Name all target files and the validation command in the handoff; maximum three linked documentation files.
        - All other protected-area exclusions remain in force, including incidents.
      dispatch: Directly from the router; no Database Engineer intermediary or nested delegation.
  standard:
    agents: all domain specialists
    model: runtime-default
    criteria:
      - Anything not fast, including diagnosis, design, multi-file or cross-module changes, protected areas, and incidents.
  escalation: A fast agent replies `ESCALATE` when out of scope; the router reroutes to the owning specialist and never retries the fast tier for the same work.

triggerRouting:
  version: v1
  defaultAgent: none
  phraseToAgent:
    - {trigger: backend-api, agent: backend-dev, intent: add repair or review a Quarkus REST endpoint or service rule}
    - {trigger: backend-auth, agent: backend-dev, intent: change backend authentication session filters or HMAC handling}
    - {trigger: downstream-client, agent: backend-dev, intent: change backend service-to-service calls or propagated headers}
    - {trigger: backend-test, agent: backend-dev, intent: add a backend unit or integration test with implementation context}
    - {trigger: kubernetes, agent: devops, intent: change Kubernetes manifests ingress services or runtime configuration}
    - {trigger: ci-cd, agent: devops, intent: change build test deployment or release automation}
    - {trigger: runtime-observability, agent: devops, intent: configure or diagnose metrics logs OpenTelemetry Tempo or Grafana}
    - {trigger: deployment, agent: devops, intent: package deploy expose or troubleshoot a service}
    - {trigger: ios-ui, agent: ios-dev, intent: build or repair UIKit or SwiftUI screens and navigation}
    - {trigger: ios-networking, agent: ios-dev, intent: change APIClient Endpoint service wrappers or decoding}
    - {trigger: ios-session, agent: ios-dev, intent: change iOS authentication session headers or keychain behavior}
    - {trigger: ios-test, agent: ios-dev, intent: add iOS unit UI or networking tests}
    - {trigger: database-schema, agent: database-dev, intent: change MySQL schema migrations triggers or stored procedures}
    - {trigger: database-query, agent: database-dev, intent: create diagnose or optimize SQL queries and indexes}
    - {trigger: database-integrity, agent: database-dev, intent: validate relational constraints transactions or data consistency}
    - {trigger: database-repair, agent: database-dev, intent: create a bounded data repair or backfill}
    - {trigger: web-ui, agent: frontend-dev, intent: build or repair AngularJS templates controllers or styling}
    - {trigger: web-routing, agent: frontend-dev, intent: change browser routes navigation or SPA behavior}
    - {trigger: web-integration, agent: frontend-dev, intent: integrate the web UI with backend endpoints and contracts}
    - {trigger: web-accessibility, agent: frontend-dev, intent: improve frontend accessibility forms or responsive behavior}
    - {trigger: test-automation, agent: testing-engineer, intent: create or maintain Appium API integration or end-to-end suites}
    - {trigger: regression-test, agent: testing-engineer, intent: reproduce a defect and add a regression test}
    - {trigger: flaky-test, agent: testing-engineer, intent: diagnose and stabilize nondeterministic tests}
    - {trigger: coverage-analysis, agent: testing-engineer, intent: assess test coverage gaps and release risk}
    - {trigger: security-review, agent: security-specialist, intent: inspect code or configuration for exploitable vulnerabilities}
    - {trigger: auth-security, agent: security-specialist, intent: review authorization authentication cookies headers or transport}
    - {trigger: dependency-security, agent: security-specialist, intent: assess dependency vulnerabilities and remediation}
    - {trigger: secret-handling, agent: security-specialist, intent: review secret storage exposure or rotation}
    - {trigger: performance-test, agent: performance-engineer, intent: create or run load stress or benchmark scenarios}
    - {trigger: profiling, agent: performance-engineer, intent: profile CPU memory IO database or request hot spots}
    - {trigger: performance-tuning, agent: performance-engineer, intent: tune cache query service or concurrency performance}
    - {trigger: performance-budget, agent: performance-engineer, intent: define measurable latency throughput or resource budgets}
    - {trigger: ai-experiment, agent: ai-researcher, intent: design an AI or prompt experiment with success metrics}
    - {trigger: ai-evaluation, agent: ai-researcher, intent: compare model or prompt behavior with an evaluation set}
    - {trigger: ai-dataset, agent: ai-researcher, intent: prepare or assess a dataset for model work}
    - {trigger: ai-drift, agent: ai-researcher, intent: analyze AI output quality regressions or drift}
    - {trigger: requirements, agent: business-analyst, intent: refine a request into scoped user stories and constraints}
    - {trigger: acceptance-criteria, agent: business-analyst, intent: write measurable acceptance criteria and edge cases}
    - {trigger: process-analysis, agent: business-analyst, intent: map a business workflow dependencies and risks}
    - {trigger: backlog-priority, agent: business-analyst, intent: prioritize work by value risk and dependency}
    - {trigger: cpp-feature, agent: cpp-developer, intent: implement or refactor C++ and OpenCV functionality}
    - {trigger: cpp-memory-safety, agent: cpp-developer, intent: diagnose ownership lifetime or undefined behavior}
    - {trigger: cpp-performance, agent: cpp-developer, intent: optimize performance-critical C++ code}
    - {trigger: cpp-test, agent: cpp-developer, intent: add low-level C++ tests}
    - {trigger: lookup, agent: fast-lane, intent: locate code config or docs and summarize evidence without edits}
    - {trigger: quick-edit, agent: fast-lane, intent: apply a fully specified mechanical edit in at most two files}
    - {trigger: quick-edit, agent: fast-lane, intent: record an approved schema decision in up to three named documentation files under the modelTiers documentation exception}
